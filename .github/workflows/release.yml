name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags starting with 'v', e.g., v1.0.0

permissions:
  contents: write

# Opt into Node.js 24 now — avoids the deprecation warning on all actions.
# Remove this after Node.js 24 becomes the default (post June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The tag, the phone app (pubspec.yaml) and the desktop app
      # (AppVersion in app.go) must all name the same version.
      - name: Check versions match the tag
        run: |
          PHONE=v$(sed -n 's/^version: *\([^+]*\).*/\1/p' mobile/pubspec.yaml)
          DESK=$(sed -n 's/^const AppVersion = "\(.*\)"/\1/p' desktop/app.go)
          echo "tag=$GITHUB_REF_NAME phone=$PHONE desktop=$DESK"
          if [ "$PHONE" != "$GITHUB_REF_NAME" ] || [ "$DESK" != "$GITHUB_REF_NAME" ]; then
            echo "::error::versions don't match the tag"
            exit 1
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/palt-release.keystore

      - name: Flutter Pub Get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_FILE: palt-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release --dart-define=APP_VERSION=$VERSION

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          mv mobile/build/app/outputs/flutter-apk/app-release.apk "mobile/build/app/outputs/flutter-apk/palt-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: palt-android-apk
          path: mobile/build/app/outputs/flutter-apk/palt-*.apk

  build-desktop:
    name: Build Linux Desktop (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          # go.sum lives in desktop/, not the repo root — without this the
          # cache-restore step fails with "Dependencies file is not found".
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies for Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl dpkg-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails Binary
        working-directory: desktop
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform linux/amd64 -tags webkit2_41

      - name: Package .deb
        working-directory: desktop
        run: |
          # Strip the 'v' from the tag name (e.g., v1.0.8 -> 1.0.8)
          VERSION=${GITHUB_REF_NAME#v}
          
          echo "Packaging PALT version $VERSION for DEBIAN..."
          
          # Create .deb directory structure
          mkdir -p build/deb/usr/local/bin
          mkdir -p build/deb/usr/share/applications
          mkdir -p build/deb/usr/share/icons/hicolor/512x512/apps
          mkdir -p build/deb/usr/share/nautilus-python/extensions
          mkdir -p build/deb/DEBIAN
          
          # Move binary & icon
          cp build/bin/palt build/deb/usr/local/bin/
          chmod +x build/deb/usr/local/bin/palt

          # Fingerprint unlock helper that PAM runs (cmd/palt-unlock)
          CGO_ENABLED=0 go build -trimpath -o build/deb/usr/local/bin/palt-unlock ./cmd/palt-unlock
          chmod 755 build/deb/usr/local/bin/palt-unlock
          
          if [ -f "build/appicon.png" ]; then
            cp build/appicon.png build/deb/usr/share/icons/hicolor/512x512/apps/palt.png
          fi
          
          # Nautilus "Send with PALT" menu (active when python3-nautilus is installed)
          cp packaging/palt-nautilus.py build/deb/usr/share/nautilus-python/extensions/

          # GNOME Shell helper that lets PALT sync the clipboard in the background
          mkdir -p build/deb/usr/share/gnome-shell/extensions
          cp -r "packaging/palt-clipboard@palt" build/deb/usr/share/gnome-shell/extensions/

          # Create control file
          cat <<EOF > build/deb/DEBIAN/control
          Package: palt
          Version: $VERSION
          Section: base
          Priority: optional
          Architecture: amd64
          Recommends: python3-nautilus, pulseaudio-utils, pkexec, fuse3
          Maintainer: h200137j <h200137j@users.noreply.github.com>
          Description: PALT
           Peer And Local Transfer - A frictionless cross-platform local network file transfer app.
          EOF
          
          # Create Desktop Entry
          cat <<EOF > build/deb/usr/share/applications/palt.desktop
          [Desktop Entry]
          Name=PALT
          Exec=/usr/local/bin/palt
          Icon=palt
          Type=Application
          Categories=Utility;Network;
          Terminal=false
          EOF
          
          # Build .deb package
          dpkg-deb --root-owner-group --build build/deb palt-${GITHUB_REF_NAME}-linux-amd64.deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: palt-linux-deb
          path: desktop/palt-*-linux-amd64.deb

  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails Binary
        working-directory: desktop
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform windows/amd64

      - name: Rename EXE
        shell: bash
        run: |
          mv desktop/build/bin/palt.exe "desktop/build/bin/palt-${GITHUB_REF_NAME}-windows-amd64.exe"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: palt-windows-exe
          path: desktop/build/bin/palt-*-windows-amd64.exe

  release:
    name: Publish Release
    needs: [build-mobile, build-desktop, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The tag's section of CHANGELOG.md is the release notes; both apps
      # show them in "What's new".
      - name: Release Notes
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"
            exit 1
          fi
          cat release-notes.md

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/palt-android-apk/palt-*.apk
            release-artifacts/palt-linux-deb/palt-*-linux-amd64.deb
            release-artifacts/palt-windows-exe/palt-*-windows-amd64.exe
          body_path: release-notes.md
